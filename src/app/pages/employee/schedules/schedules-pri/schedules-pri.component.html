<p-card styleClass="invoice-header-card mb-4">
  <div class="invoice-header">
    <div class="invoice-header__title">
      <h2>Schedules</h2>
      <p>Manage employee shifts by location and employee.</p>
    </div>

    <div class="invoice-header__filters">
      <div class="invoice-filter">
        <label class="invoice-filter__label">
          <i class="pi pi-map-marker"></i>
          <span>Locations</span>
        </label>

        <p-multiSelect
          [options]="locations"
          [(ngModel)]="selectedLocation"
          optionLabel="location_name"
          placeholder="Select locations"
          display="chip"
          styleClass="w-full"
          appendTo="body"
          (onChange)="onFilterChange()"
        >
        </p-multiSelect>
      </div>

      <div class="invoice-filter">
        <label class="invoice-filter__label">
          <i class="pi pi-users"></i>
          <span>Employees</span>
        </label>

        <p-select
          [(ngModel)]="selectedEmployeeId"
          [options]="employees"
          optionLabel="user_name"
          optionValue="user_id"
          placeholder="All employees"
          appendTo="body"
          [showClear]="true"
          (onChange)="onFilterChange()"
        >
          <ng-template pTemplate="item" let-employee>
            <div class="employee-option">
              <span
                class="employee-color"
                [style.background]="employee.color || '#607D8B'"
              >
              </span>

              <span>
                {{ employee.user_name }} {{ employee.user_apellido }}
              </span>
            </div>
          </ng-template>

          <ng-template pTemplate="selectedItem" let-employee>
            <div class="employee-option" *ngIf="employee">
              <span
                class="employee-color"
                [style.background]="employee.color || '#607D8B'"
              >
              </span>

              <span>
                {{ employee.user_name }} {{ employee.user_apellido }}
              </span>
            </div>
          </ng-template>
        </p-select>
      </div>
    </div>
  </div>
</p-card>

<div *ngIf="loading" class="text-muted py-3">Loading schedules...</div>

<p-card *ngIf="!loading" styleClass="shadow-sm">
  <app-schedules-list
    [schedules]="schedules"
    [employees]="employees"
    (create)="openCreate($event)"
    (edit)="openEdit($event)"
    (moved)="moveSchedule($event)"
  >
  </app-schedules-list>
</p-card>

<app-schedules-ups-ins
  *ngIf="scheduleDialogVisible"
  [mode]="modalMode"
  [schedule]="selectedSchedule"
  [employees]="employees"
  [locations]="locations"
  [selectedStartDate]="selectedStartDate"
  [selectedEndDate]="selectedEndDate"
  [saving]="saving"
  (close)="closeDialog()"
  (submit)="saveSchedule($event)"
  (delete)="deleteSchedule($event)"
>
</app-schedules-ups-ins>
