<div class="d-flex align-items-center gap-2 mb-3 mt-2 px-1">
  <input
    #searchInput
    type="text"
    class="form-control form-control-sm"
    placeholder="Search..."
    (input)="dt.filterGlobal(searchInput.value, 'contains')"
  />

  <button
    pButton
    type="button"
    icon="pi pi-file-excel"
    label="Excel"
    class="p-button-success p-button-sm text-nowrap"
    (click)="exportExcel()"
  ></button>
</div>

<p-table
  #dt
  [value]="cargos"
  responsiveLayout="scroll"
  styleClass="p-datatable-sm"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 20, 50]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
  [globalFilterFields]="[
    'cargo_id',
    'cargo_nombre',
    'cargo_descripcion',
    'cargo_estado',
    'location.location_name',
    'tarifa_hora',
    'tarifa_hora_extra',
  ]"
>
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Status</th>
      <th>Position</th>
      <th>Description</th>
      <th>Location</th>
      <th>Hourly Rate</th>
      <th>Overtime Rate</th>
      <th class="text-end">Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-item>
    <tr>
      <td>
        {{ item.cargo_id }}
      </td>

      <td>
        <p-tag
          [severity]="item.cargo_estado === 'A' ? 'success' : 'secondary'"
          [value]="item.cargo_estado === 'A' ? 'Active' : 'Inactive'"
        ></p-tag>
      </td>

      <td>
        {{ item.cargo_nombre || "—" }}
      </td>

      <td>
        {{ item.cargo_descripcion || "—" }}
      </td>

      <td>
        {{ item.location?.location_name || "—" }}
      </td>

      <td>$ {{ item.tarifa_hora || 0 }}</td>

      <td>$ {{ item.tarifa_hora_extra || 0 }}</td>

      <td class="text-end">
        <button
          type="button"
          class="btn btn-sm btn-warning m-1"
          (click)="onEdit(item)"
        >
          Edit
        </button>

        <button
          type="button"
          class="btn btn-sm btn-danger m-1"
          (click)="onDelete(item)"
        >
          Delete
        </button>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="8" class="text-center text-muted py-4">
        No positions found
      </td>
    </tr>
  </ng-template>
</p-table>
