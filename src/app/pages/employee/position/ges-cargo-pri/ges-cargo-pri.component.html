<div class="container-fluid py-3 px-0" style="width: 100%">
  <div class="row g-3 mb-4 bg-white">
    <p-card styleClass="invoice-header-card w-100">
      <div class="row align-items-center mb-3">
        <div class="col-md-8">
          <div class="invoice-header__title">
            <h2>Position Management</h2>
            <p>Manage positions, hourly rates, and overtime rates.</p>
          </div>
        </div>

        <div class="col-md-4 text-end">
          <button class="btn btn-primary" (click)="openCreate()">
            <i class="pi pi-plus me-2"></i>
            Add Position
          </button>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <p-inputGroup>
            <p-inputGroupAddon>
              <i class="pi pi-map-marker"></i>
            </p-inputGroupAddon>

            <p-multiSelect
              [options]="locations"
              [(ngModel)]="selectedLocation"
              optionLabel="location_name"
              placeholder="Select locations"
              display="chip"
              styleClass="w-100"
              (onChange)="loadData()"
            >
            </p-multiSelect>
          </p-inputGroup>
        </div>
      </div>
    </p-card>

    <div class="col-12">
      <p-card styleClass="shadow-sm">
        <div *ngIf="loading" class="text-muted py-3">Loading...</div>

        <app-ges-cargo-list
          *ngIf="!loading"
          [cargos]="cargos"
          (edit)="openEdit($event)"
          (delete)="handleDelete($event)"
        ></app-ges-cargo-list>
      </p-card>
    </div>
  </div>
</div>

<app-ges-cargo-upd-ins
  *ngIf="showCargoModal"
  [mode]="modalMode"
  [cargo]="selectedCargo"
  (close)="closeModal()"
  (submit)="handleSubmit($event)"
>
</app-ges-cargo-upd-ins>
