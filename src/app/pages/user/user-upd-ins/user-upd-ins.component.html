<p-dialog
  [visible]="true"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  styleClass="user-modal"
  [style]="{ width: '950px', maxWidth: '95vw' }"
>
  <!-- Header -->
  <ng-template pTemplate="header">
    <div class="d-flex justify-content-between align-items-center w-100">
      <h2 class="modal-title mb-0">
        {{ mode === "edit" ? "Update User" : "Add New User" }}
      </h2>

      <button
        type="button"
        class="btn-close"
        aria-label="Close"
        (click)="onClose()"
      ></button>
    </div>
  </ng-template>

  <!-- Body -->
  <form #userForm="ngForm" novalidate>
    <div class="modal-body-content">
      <input type="hidden" name="user_id" [(ngModel)]="formData.user_id" />

      <p-tabView>
        <!-- REQUIRED TAB -->
        <p-tabPanel header="Required Information">
          <div class="row g-3">
            <!-- First Name -->
            <div class="col-md-4">
              <label class="form-label">
                First Name <span class="text-danger">*</span>
              </label>

              <input
                pInputText
                type="text"
                name="user_name"
                class="w-100"
                required
                [(ngModel)]="formData.user_name"
                #userName="ngModel"
                placeholder="Enter first name"
              />

              <small
                class="text-danger"
                *ngIf="userName.invalid && userName.touched"
              >
                First Name is required.
              </small>
            </div>

            <!-- Last Name -->
            <div class="col-md-4">
              <label class="form-label">
                Last Name <span class="text-danger">*</span>
              </label>

              <input
                pInputText
                type="text"
                name="user_apellido"
                class="w-100"
                required
                [(ngModel)]="formData.user_apellido"
                #userApellido="ngModel"
                placeholder="Enter last name"
              />

              <small
                class="text-danger"
                *ngIf="userApellido.invalid && userApellido.touched"
              >
                Last Name is required.
              </small>
            </div>

            <!-- Email -->
            <div class="col-md-4">
              <label class="form-label">
                Email <span class="text-danger">*</span>
              </label>

              <input
                pInputText
                type="email"
                name="user_email"
                class="w-100"
                required
                email
                [(ngModel)]="formData.user_email"
                #userEmail="ngModel"
                placeholder="email@domain.com"
              />

              <small
                class="text-danger"
                *ngIf="userEmail.errors?.['required'] && userEmail.touched"
              >
                Email is required.
              </small>

              <small
                class="text-danger"
                *ngIf="userEmail.errors?.['email'] && userEmail.touched"
              >
                Enter a valid email.
              </small>
            </div>

            <!-- Location -->
            <div class="col-md-4">
              <label class="form-label">
                Location <span class="text-danger">*</span>
              </label>

              <p-dropdown
                name="location_id"
                [options]="locations"
                [(ngModel)]="formData.location_id"
                optionLabel="location_name"
                optionValue="location_id"
                placeholder="Select location"
                styleClass="w-100"
                required
                #locationId="ngModel"
              ></p-dropdown>

              <small
                class="text-danger"
                *ngIf="locationId.invalid && locationId.touched"
              >
                Location is required.
              </small>
            </div>

            <!-- Role -->
            <div class="col-md-4">
              <label class="form-label">
                Role <span class="text-danger">*</span>
              </label>

              <p-dropdown
                name="user_rol"
                [options]="roles"
                [(ngModel)]="formData.user_rol"
                optionLabel="label"
                optionValue="value"
                placeholder="Select role"
                styleClass="w-100"
                required
                #userRol="ngModel"
              ></p-dropdown>

              <small
                class="text-danger"
                *ngIf="userRol.invalid && userRol.touched"
              >
                Role is required.
              </small>
            </div>

            <!-- Position ID -->
            <div class="col-md-4">
              <label class="form-label">
                Position ID <span class="text-danger">*</span>
              </label>

              <p-dropdown
                name="cargo_id"
                [options]="cargos"
                [(ngModel)]="formData.cargo_id"
                optionLabel="cargo_nombre"
                optionValue="cargo_id"
                placeholder="Select position"
                styleClass="w-100"
                required
                #cargoId="ngModel"
                [disabled]="!formData.location_id || cargos.length === 0"
              ></p-dropdown>

              <small
                class="text-danger"
                *ngIf="cargoId.invalid && cargoId.touched"
              >
                Position ID is required.
              </small>
            </div>

            <!-- Status only edit -->
            <div class="col-md-4" *ngIf="mode === 'edit'">
              <label class="form-label">Status</label>

              <p-dropdown
                name="user_estado"
                [options]="statuses"
                [(ngModel)]="formData.user_estado"
                optionLabel="label"
                optionValue="value"
                placeholder="Select status"
                styleClass="w-100"
              ></p-dropdown>
            </div>
          </div>
        </p-tabPanel>

        <!-- OPTIONAL TAB -->
        <p-tabPanel header="Additional Information">
          <div class="row g-3">
            <!-- Phone -->
            <div class="col-md-4">
              <label class="form-label">Phone</label>

              <input
                pInputText
                type="text"
                name="user_telefono"
                class="w-100"
                [(ngModel)]="formData.user_telefono"
                placeholder="Enter phone number"
              />
            </div>

            <!-- Document Number -->
            <div class="col-md-4">
              <label class="form-label">Document Number</label>

              <input
                pInputText
                type="text"
                name="user_documento"
                class="w-100"
                [(ngModel)]="formData.user_documento"
                placeholder="Enter document number"
              />
            </div>

            <!-- External Code -->
            <div class="col-md-4">
              <label class="form-label">External Code</label>

              <input
                pInputText
                type="text"
                name="ext_code"
                class="w-100"
                [(ngModel)]="formData.ext_code"
                placeholder="Enter external code"
              />
            </div>

            <!-- Start Date -->
            <div class="col-md-4">
              <label class="form-label">Start Date</label>

              <input
                pInputText
                type="date"
                name="user_fecha_ingreso"
                class="w-100"
                [(ngModel)]="formData.user_fecha_ingreso"
              />
            </div>

            <!-- Address -->
            <div class="col-md-8">
              <label class="form-label">Address</label>

              <input
                pInputText
                type="text"
                name="user_direccion"
                class="w-100"
                [(ngModel)]="formData.user_direccion"
                placeholder="Enter address"
              />
            </div>
          </div>
        </p-tabPanel>
      </p-tabView>

      <div class="mt-3">
        <p-message
          severity="info"
          [text]="
            mode === 'edit'
              ? 'You can update the password using the Change Password option'
              : 'Default password is 123456'
          "
        ></p-message>
      </div>
    </div>
  </form>

  <!-- Footer -->
  <ng-template pTemplate="footer">
    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-secondary" (click)="onClose()">
        Cancel
      </button>

      <button
        type="button"
        class="btn btn-primary"
        (click)="onSubmit(userForm)"
      >
        {{ mode === "edit" ? "Save Changes" : "Create" }}
      </button>
    </div>
  </ng-template>
</p-dialog>
