<div class="modal-backdrop">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>
        {{ "Update Daily Metric" }}
      </h2>
      <button class="close-btn" type="button" (click)="onClose()">✕</button>
    </div>

    <div class="modal-body">
      <form #dmForm="ngForm">
        <!-- ID (hidden) -->
        <input type="hidden" [(ngModel)]="formData.daily_metric_id" name="daily_metric_id" />

        <!-- Row: Date + Location -->
        <div class="form-group">
          <div class="row-inline">
            <div class="field">
              <label>Date</label>
              <input type="date" [(ngModel)]="formData.daily_metric_date" name="daily_metric_date" required
                #metricDate="ngModel" />

              <small class="error" *ngIf="
                  metricDate.invalid && (metricDate.touched || dmForm.submitted)
                ">
                Date is required
              </small>
            </div>

            <div class="field">
              <label>Location</label>
              <select [(ngModel)]="formData.location_id" name="location_id" required #location="ngModel">
                <option [ngValue]="''">Select location</option>
                <option *ngFor="let loc of locations" [ngValue]="loc.location_id">
                  {{ loc.location_name }}
                </option>
              </select>

              <small class="error" *ngIf="
                  location.invalid && (location.touched || dmForm.submitted)
                ">
                Location is required
              </small>
            </div>
          </div>
        </div>

        <!-- Row: Tickets + Net Sales -->
        <div class="form-group">
          <div class="row-inline">
            <div class="field">
              <label>Tickets</label>
              <input type="number" min="0" step="1" [(ngModel)]="formData.daily_metric_tickets"
                name="daily_metric_tickets" required #tickets="ngModel" />

              <small class="error" *ngIf="tickets.invalid && (tickets.touched || dmForm.submitted)">
                Tickets are required
              </small>
            </div>

            <div class="field">

              <label>Daily Hourly</label>
              <input type="number" min="0" step="0.01" [(ngModel)]="formData.daily_metric_daily_hourly"
                name="daily_metric_daily_hourly" required #dailyHourly="ngModel" />

              <small class="error" *ngIf="
              dailyHourly.invalid && (dailyHourly.touched || dmForm.submitted)
            ">
                Daily hourly is required
              </small>
            </div>
          </div>
        </div>

        <!-- Daily Hourly -->
        <div class="form-group">
          <div class="row-inline">
            <div class="field">
              <label>Gross Sales</label>
              <input type="number" min="0" step="0.01" [(ngModel)]="formData.daily_metric_grossSales"
                (ngModelChange)="calculateNetSales()" name="daily_metric_grossSales" required #grossSales="ngModel" />

              <small class="error" *ngIf="
                  grossSales.invalid && (grossSales.touched || dmForm.submitted)
                ">
                Taxes are required
              </small>
            </div>

            <div class="field">
              <label>Taxes</label>
              <input type="number" min="0" step="0.01" [(ngModel)]="formData.daily_metric_taxes"
                (ngModelChange)="calculateNetSales()" name="daily_metric_taxes" required #netTaxes="ngModel" />

              <small class="error" *ngIf="
                  netTaxes.invalid && (netTaxes.touched || dmForm.submitted)
                ">
                Net sales are required
              </small>
            </div>

          </div>

        </div>

        <div class="form-group">
          <div class="row-inline">
            <div class="field">
              <label>Tips</label>
              <input type="number" min="0" step="0.01" [(ngModel)]="formData.daily_metric_tips" name="daily_metric_tips"
                (ngModelChange)="calculateNetSales()" required #tips="ngModel" />

              <small class="error" *ngIf="
                  tips.invalid && (tips.touched || dmForm.submitted)
                ">
                Tips are required
              </small>
            </div>

            <div class="field">
              <label>Discounts</label>
              <input type="number" min="0" step="0.01" [(ngModel)]="formData.daily_metric_discounts"
                (ngModelChange)="calculateNetSales()" name="daily_metric_discounts" required #discounts="ngModel" />

              <small class="error" *ngIf="
                  discounts.invalid && (discounts.touched || dmForm.submitted)
                ">
                Discounts are required
              </small>
            </div>
          </div>
        </div>

        <div class="form-group">
          <div class="row-inline">
            <div class="field">
              <label>Other Payments</label>
              <input type="number" min="0" step="0.01" [(ngModel)]="formData.daily_metric_otherPayments"
                (ngModelChange)="calculateNetSales()" name="daily_metric_otherPayments" required
                #otherPayments="ngModel" />

              <small class="error" *ngIf="
                  otherPayments.invalid && (otherPayments.touched || dmForm.submitted)
                ">
                Other Payments are required
              </small>
            </div>

            <div class="field">
              <label>Net Sales</label>
              <input type="number" min="0" step="0.01" [(ngModel)]="formData.daily_metric_net_sales" disabled="true"
                name="daily_metric_net_sales" required #netSales="ngModel" />

              <small class="error" *ngIf="
                  netSales.invalid && (netSales.touched || dmForm.submitted)
                ">
                Net sales are required
              </small>
            </div>
          </div>
        </div>

        <!-- Audit info (solo edit) -->
        <app-audit-info [createdAt]="formData.created_at ?? undefined" [createdBy]="
            formData.created_user?.user_name ?? formData.created_by ?? undefined
          " [modifiedAt]="formData.updated_at ?? undefined" [modifiedBy]="
            formData.updated_user?.user_name ?? formData.created_by ?? undefined
          "></app-audit-info>
      </form>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="onClose()">
        Cancel
      </button>

      <button class="btn btn-primary" type="button" (click)="onSubmit()" [disabled]="dmForm.invalid">
        {{ "Save Changes" }}
      </button>
    </div>
  </div>
</div>
