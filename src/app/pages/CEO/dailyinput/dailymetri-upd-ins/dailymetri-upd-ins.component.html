<div class="row">
  <div class="col-12">

    <div class="page">
      <h2 class="title">Daily Input</h2>
      <p class="subtitle">Add daily metrics for your locations</p>

      <div class="card">
        <div class="card-header">
          <h3>Add Daily Metrics</h3>
        </div>

        <form [formGroup]="form" (ngSubmit)="save()" class="form">
          <!-- Locations -->
          <div class="mb-3">

          </div>

          <!-- Row 1 -->
          <div class="row g-3">

            <div class="col-md-4">
              <label class="form-label">
                Location (for new entry) <span class="req">*</span>
              </label>

              <p-dropdown [options]="locations" formControlName="location_id" optionLabel="location_name"
                optionValue="location_id" placeholder="Select location" styleClass="w-100"></p-dropdown>
              <small class="text-danger" *ngIf="isInvalid('location_id')">
                Location is required
              </small>
            </div>

            <div class="col-md-4">
              <label class="form-label">Date</label>

              <p-datepicker formControlName="date" [showIcon]="true" dateFormat="yy-mm-dd" styleClass="w-100"
                inputStyleClass="w-100"></p-datepicker>

              <small class="text-danger" *ngIf="isInvalid('date')">
                Date is required
              </small>
            </div>

          </div>
          <div class="row g-3">

            <div class="col-md-4">
              <label class="form-label">Number of Tickets</label>

              <p-inputNumber formControlName="tickets" [min]="0" [useGrouping]="false" styleClass="w-100"
                inputStyleClass="w-100"></p-inputNumber>
            </div>

            <div class="col-md-4">
              <label class="form-label">Daily Hourly Labour ($)</label>

              <p-inputNumber formControlName="dailyHourly" [min]="0" mode="decimal" [minFractionDigits]="2"
                [maxFractionDigits]="2" [useGrouping]="false" styleClass="w-100"
                inputStyleClass="w-100"></p-inputNumber>
            </div>


          </div>

          <!-- Row 2 -->
          <div class="row g-3 mt-1">
            <div class="col-md-4">
              <label class="form-label">Gross Sales ($)</label>

              <p-inputNumber formControlName="grossSales" [min]="0" mode="decimal" [minFractionDigits]="2"
                [maxFractionDigits]="2" [useGrouping]="false" styleClass="w-100"
                inputStyleClass="w-100"></p-inputNumber>
            </div>

            <div class="col-md-4">
              <label class="form-label">Taxes ($)</label>

              <p-inputNumber formControlName="taxes" [min]="0" mode="decimal" [minFractionDigits]="2"
                [maxFractionDigits]="2" [useGrouping]="false" styleClass="w-100"
                inputStyleClass="w-100"></p-inputNumber>
            </div>

            <div class="col-md-4">
              <label class="form-label">Tip ($)</label>

              <p-inputNumber formControlName="tips" [min]="0" mode="decimal" [minFractionDigits]="2"
                [maxFractionDigits]="2" [useGrouping]="false" styleClass="w-100"
                inputStyleClass="w-100"></p-inputNumber>
            </div>


          </div>

          <!-- Row 3 -->
          <div class="row g-3 mt-1">


            <div class="col-md-4">
              <label class="form-label">Discounts ($)</label>

              <p-inputNumber formControlName="discounts" [min]="0" mode="decimal" [minFractionDigits]="2"
                [maxFractionDigits]="2" [useGrouping]="false" styleClass="w-100"
                inputStyleClass="w-100"></p-inputNumber>
            </div>

            <div class="col-md-4">
              <label class="form-label">Other Payments ($)</label>

              <p-inputNumber formControlName="otherPayments" [min]="0" mode="decimal" [minFractionDigits]="2"
                [maxFractionDigits]="2" [useGrouping]="false" styleClass="w-100"
                inputStyleClass="w-100"></p-inputNumber>
            </div>

            <div class="col-md-4">
              <label class="form-label">Net Sales ($)</label>

              <p-inputNumber formControlName="netSales" [min]="0" mode="decimal" [minFractionDigits]="2"
                [disabled]="true" [maxFractionDigits]="2" [useGrouping]="false" styleClass="w-100"
                inputStyleClass="w-100"></p-inputNumber>
            </div>

          </div>

          <p-button type="submit" label="{{ saving ? 'Saving...' : 'Save New Entry' }}" icon="pi pi-save"
            [disabled]="saving || form.invalid" styleClass="p-button-primary mt-3"></p-button>
        </form>
      </div>
    </div>

  </div>
</div>
