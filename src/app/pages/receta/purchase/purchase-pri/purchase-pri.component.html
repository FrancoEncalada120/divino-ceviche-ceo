<div class="container-fluid py-3 px-0" style="width: 100%;">

  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="page">
        <h2 class="title">Purchase Management</h2>
        <p class="subtitle">Register and manage purchase records, including suppliers, products, quantities, and
          total amounts</p>

      </div>

      <button class="btn btn-primary" (click)="openCreate()">Add New Purchase</button>
    </div>
  </div>

  <div class="row g-3 mb-4 bg-white pb-1">

    <!-- Date range -->
    <div class="col-12 col-md-3">
      <label class="filter-label d-block mb-1">
        <i class="pi pi-calendar"></i> Date Range
      </label>

      <p-datepicker [(ngModel)]="dateRange" selectionMode="range" dateFormat="dd/mm/yy" [showIcon]="true"
        [readonlyInput]="true" class="w-100" (ngModelChange)="onLocationsChangeDate($event)">
      </p-datepicker>


    </div>

    <div class="col-12 col-md-3">
      <label class="filter-label d-block mb-1">
        <i class="pi pi-calendar"></i> Supply
      </label>

      <p-dropdown [options]="insumos" optionLabel="nombreCompleto" optionValue="insumo_id" [filter]="true"
        [(ngModel)]="selectedInsumos" [showClear]="true" placeholder="Select Supply" appendTo="body"
        class="w-100" (ngModelChange)="onLocationsChangeDate($event)" ></p-dropdown>

    </div>

    <div class="col-12 col-md-3">
      <label class="filter-label d-block mb-1">
        <i class="pi pi-calendar"></i> Supplier
      </label>

      <p-dropdown [options]="proveedores" optionLabel="nombre" optionValue="proveedor_id" [filter]="true"
        [(ngModel)]="selectedProveedor" [showClear]="true" placeholder="Select Supplier" appendTo="body"
        class="w-100" (ngModelChange)="onLocationsChangeDate($event)" ></p-dropdown>

    </div>

  </div>


  <app-purchase-upd-ins *ngIf="showAddLocationModal" [mode]="modalMode" (close)="closeModal()"
    (submit)="handleSubmit($event)" [compras]="selectedItem"></app-purchase-upd-ins>


  <app-purchase-list (edit)="openEdit($event)" (delete)="delete($event)"
    [compraDetalle]="compraDetalle"></app-purchase-list>

  <app-purchase-confirmation *ngIf="showConfirmanModal" [recetas_impactadas]="recetas_impactadas"
    [txtDetail]="txtDetail" [txtSummary]="txtSummary" (close)="closeModalConfirm()"></app-purchase-confirmation>


</div>
