<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="fw-bold mb-1">Monthly Goals</h4>
    <p class="text-muted mb-0">Set targets for sales, costs, and margins by location</p>
  </div>

  <button class="btn btn-primary" (click)="openCreate()">Add Goal</button>
</div>

<div class="card">

  <app-purchase-upd-ins *ngIf="showAddLocationModal" [mode]="modalMode" (close)="closeModal()"
    (submit)="handleSubmit($event)" [compras]="selectedItem"></app-purchase-upd-ins>

</div>


<app-purchase-list (edit)="openEdit($event)" (delete)="delete($event)" [compras]="compras"></app-purchase-list>
