<p-card styleClass="invoice-header-card mb-4">
    <div class="invoice-header">
      <div class="invoice-header__title">
        <h2>Purchase Management</h2>
        <p>Register and manage purchase records, including suppliers, products, quantities, and total amounts.</p>
      </div>

      <div class="invoice-header__filters">
        <div class="invoice-filter invoice-filter--date">
          <label class="invoice-filter__label">
            <i class="pi pi-calendar"></i>
            <span>Date Range</span>
          </label>
          <p-datepicker
            [(ngModel)]="dateRange"
            selectionMode="range"
            dateFormat="dd/mm/yy"
            [showIcon]="true"
            [readonlyInput]="true"
            styleClass="w-full"
            (ngModelChange)="onLocationsChangeDate($event)"
          ></p-datepicker>
        </div>

        <div class="invoice-filter">
          <label class="invoice-filter__label">
            <i class="pi pi-box"></i>
            <span>Supply</span>
          </label>
          <p-multiSelect
            [options]="insumos"
            [(ngModel)]="selectedInsumos"
            optionLabel="nombreCompleto"
            placeholder="Select Supply"
            display="chip"
            styleClass="w-full"
            (onChange)="onSupplyChange($event)"
          ></p-multiSelect>
        </div>

        <div class="invoice-filter">
          <label class="invoice-filter__label">
            <i class="pi pi-truck"></i>
            <span>Supplier</span>
          </label>
          <p-multiSelect
            [options]="proveedores"
            [(ngModel)]="selectedProveedor"
            optionLabel="nombre"
            placeholder="Select Supplier"
            display="chip"
            styleClass="w-full"
            (onChange)="onSupplyChange($event)"
          ></p-multiSelect>
        </div>
      </div>

      <div class="text-muted small mt-2">
        {{ formattedDateRange }}
        &nbsp;·&nbsp;
        <ng-container *ngIf="selectedInsumos && selectedInsumos.length; else noneSelected">
          {{ selectedInsumosNames }}
        </ng-container>
        <ng-template #noneSelected>None</ng-template>
        &nbsp;·&nbsp;
        <ng-container *ngIf="selectedProveedor && selectedProveedor.length; else noneSelected1">
          {{ selectedProveedorNames }}
        </ng-container>
        <ng-template #noneSelected1>None</ng-template>
      </div>
    </div>
  </p-card>


<app-purchase-upd-ins *ngIf="showAddLocationModal" (close)="closeModal()"
  (submit)="handleSubmit($event)"></app-purchase-upd-ins>

<app-purchase-list (delete)="delete($event)" [compraDetalle]="compraDetalle"></app-purchase-list>

<app-purchase-confirmation *ngIf="showConfirmanModal" [recetas_impactadas]="recetas_impactadas"
  [txtDetail]="txtDetail" [txtSummary]="txtSummary" (close)="closeModalConfirm()"></app-purchase-confirmation>
