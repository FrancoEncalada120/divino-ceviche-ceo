<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-container" (click)="$event.stopPropagation()">

    <!-- HEADER -->
    <div class="modal-header">
      <h2>{{ txtSummary }}</h2>
      <button class="close-btn" (click)="onClose()">✕</button>
    </div>

    <!-- BODY -->
    <div class="modal-body">

      <!-- Mensaje -->
      <p class="modal-text">
        {{ txtDetail }}
      </p>

    </div>

  </div>
</div>
