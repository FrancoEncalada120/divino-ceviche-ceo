<p-table
  [value]="insumos"
  responsiveLayout="scroll"
  styleClass="p-datatable-sm"
>
  <!-- Header -->
  <ng-template pTemplate="header">
    <tr>
      <th>Status</th>
      <th>Ingredient Name</th>
      <th>Description</th>
      <th class="text-end">Actions</th>
    </tr>
  </ng-template>

  <!-- Body -->
  <ng-template pTemplate="body" let-item>
    <tr>
      <!-- Status -->
      <td>
        <p-tag
          [severity]="item.estado === 'A' ? 'success' : 'secondary'"
          [value]="item.estado === 'A' ? 'Active' : 'Inactive'"
        ></p-tag>
      </td>

      <!-- Name -->
      <td>
        {{ item.nombre }}
      </td>

      <!-- Description -->
      <td>
        {{ item.descripcion || "—" }}
      </td>

      <!-- Actions -->
      <td class="text-end">
        <button
          pButton
          type="button"
          label="Edit"
          icon="pi pi-pencil"
          class="p-button-sm"
          (click)="onEdit(item)"
        ></button>
      </td>
    </tr>
  </ng-template>

  <!-- Empty -->
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="4" class="text-center text-muted py-4">
        No ingredients found
      </td>
    </tr>
  </ng-template>
</p-table>
