<div class="container-fluid py-3 px-0" style="width: 100%">
  <div class="row g-3 mb-4 bg-white">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 class="fw-bold mb-1">Insumos</h4>
          <p class="text-muted mb-0">Manage your Insumos</p>
        </div>
        <button class="btn btn-primary" (click)="openCreate()">
          Add Location
        </button>
      </div>
    </div>

    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <div *ngIf="loading" class="text-muted py-3">Loading...</div>

          <app-insumos-lista
            (edit)="openEdit($event)"
            [insumo]="insumo"
          ></app-insumos-lista>
        </div>
      </div>
    </div>
  </div>
</div>
