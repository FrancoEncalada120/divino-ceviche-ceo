<div class="container-fluid py-3 px-0" style="width: 100%">
  <div class="row g-3 mb-4 bg-white">
    <p-card styleClass="invoice-header-card">
      <!-- ROW 1 -->
      <div class="row align-items-center mb-3">
        <div class="col-md-8">
          <div class="invoice-header__title">
            <h2>Supplies</h2>
            <p>Manage your supplies</p>
          </div>
        </div>

        <div class="col-md-4 text-end">
          <button class="btn btn-primary" (click)="openCreate()">
            <i class="pi pi-plus me-2"></i>
            Add New Purchase
          </button>
        </div>
      </div>

      <!-- ROW 2 -->
      <div class="row">
        <div class="col-md-6">
          <p-inputGroup>
            <p-inputGroupAddon>
              <i class="pi pi-map-marker"></i>
            </p-inputGroupAddon>

            <p-multiSelect
              [options]="locations"
              [(ngModel)]="selectedLocation"
              optionLabel="location_name"
              placeholder="Select locations"
              display="chip"
              styleClass="w-100"
              (onChange)="loadData()"
            >
            </p-multiSelect>
          </p-inputGroup>
        </div>
      </div>
    </p-card>

    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <div *ngIf="loading" class="text-muted py-3">Loading...</div>

          <app-insumos-lista
            (edit)="openEdit($event)"
            [insumos]="insumo"
          ></app-insumos-lista>
        </div>
      </div>
    </div>
  </div>
</div>

<app-insumos-upd-ins
  *ngIf="showAddInsumoModal"
  [mode]="modalMode"
  [insumo]="selectedInsunmos"
  (close)="closeModal()"
  (submit)="handleSubmit($event)"
  [location]="locations"
>
</app-insumos-upd-ins>
