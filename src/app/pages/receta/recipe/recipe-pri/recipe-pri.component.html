<div class="container-fluid py-3 px-0" style="width: 100%">
  <div class="row g-3 mb-4 bg-white">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 class="fw-bold mb-1">Recipes</h4>
          <p class="text-muted mb-0">Manage your recipes and ingredients</p>
        </div>

        <button class="btn btn-primary" (click)="openCreate()">
          Add Recipe
        </button>
      </div>
    </div>

    <div class="col-12">
      <div *ngIf="loading" class="text-muted py-3">Loading...</div>

      <app-recipe-list
        (edit)="openEdit($event)"
        [recetas]="recetas"
      ></app-recipe-list>
    </div>
  </div>
</div>

<app-recipe-up-ins
  *ngIf="showAddRecetaModal"
  [mode]="modalMode"
  [receta]="selectedReceta"
  (close)="closeModal()"
  (submit)="handleSubmit($event)"
  [insumosOptions]="insumosOptions"
  [unidadesOptions]="unidadesOptions"
></app-recipe-up-ins>
