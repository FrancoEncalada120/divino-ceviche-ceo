<div class="row g-3 mb-4 bg-white">
  <div class="card">
    <p-tabView>
      <p-tabPanel header="Groups List">
        <p-table [value]="conversiones" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 20, 50]"
          [responsiveLayout]="'stack'" breakpoint="768px" sortMode="multiple" [showCurrentPageReport]="true"
          currentPageReportTemplate="Showing {first} to {last} of {totalRecords}" styleClass="p-datatable-sm">
          <!-- Header -->
          <ng-template pTemplate="header">
            <tr>
              <th>ID</th>
              <th>Group Name</th>
              <th class="col-actions"></th>
            </tr>
          </ng-template>

          <!-- Body -->
          <ng-template pTemplate="body" let-row>
            <tr>
              <td>{{ row.grupo_id }}</td>

              <td>
                {{ row.grupo_nombre }}
              </td>

              <td class="col-actions text-end">
                <button class="btn btn-sm btn-warning m-1" (click)="onEdit(row)">
                  Edit
                </button>

                <button class="btn btn-sm btn-danger m-1" (click)="onDelete(row)">
                  Delete
                </button>
              </td>
            </tr>
          </ng-template>

          <!-- Empty -->
          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="8" class="text-center text-muted py-4">
                No conversions found
              </td>
            </tr>
          </ng-template>
        </p-table>
      </p-tabPanel>
    </p-tabView>
  </div>
</div>
